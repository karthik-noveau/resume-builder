# This server is dedicated to the Resume Builder workspace.
# Keep shells and running commands alive when VS Code disconnects.
set-option -g destroy-unattached off
set-option -g default-shell /bin/zsh
set-option -g history-limit 10000
set-option -g mouse on
# VS Code already supplies terminal tabs; avoid a second, refreshing status bar.
set-option -g status off

# Open additional shells in the same working directory.
bind-key c new-window -c "#{pane_current_path}"
