[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Static public pages are served directly. Only workspace routes use the SPA.
[[redirects]]
  from = "/app"
  to = "/workspace.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/workspace.html"
  status = 200

[[redirects]]
  from = "/share"
  to = "/workspace.html"
  status = 200

[[redirects]]
  from = "/editor/*"
  to = "/workspace.html"
  status = 200

# Unknown URLs return a real 404 rather than an indexable homepage copy.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/app"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/settings"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/share"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/editor/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/workspace.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
